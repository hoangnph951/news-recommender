<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Recommender</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Gợi ý tin tức</h1>
  <label>User
    <select id="user"><option value="__new__">User mới (chưa có lịch sử)</option></select>
  </label>
  <nav><a href="/" class="active">Demo</a><a href="/results">Kết quả thực nghiệm</a></nav>
  <span id="method" class="muted"></span>
</header>
<main class="grid">
  <section>
    <h2>Gợi ý cho bạn <span id="pop" class="muted"></span></h2>
    <div id="recs"><p class="muted">Đang tải…</p></div>
  </section>
  <section class="history"><h2>Lịch sử đọc</h2><div id="history"></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const get = (url) => fetch(url).then((r) => r.json());
const user = () => $("user").value;

function card(n, full) {
  const because = (n.because || []).length
    ? `<p class="because">Vì bạn đã đọc: ${n.because.map((t) => `“${esc(t)}”`).join(", ")}</p>` : "";
  return `<article class="card">
    ${n.score !== undefined ? `<span class="score">${n.score}</span>` : ""}
    <span class="tag">${esc(n.category)} / ${esc(n.subcategory)}</span>
    <h3>${esc(n.title)}</h3>
    ${full ? `<p>${esc(n.abstract)}</p>${because}<button data-id="${esc(n.news_id)}">Đọc tin này</button>` : ""}
  </article>`;
}

async function refresh() {
  const u = encodeURIComponent(user());
  const [rec, history] = await Promise.all([get(`/api/recommend?user_id=${u}&k=10`), get(`/api/history?user_id=${u}`)]);
  $("recs").innerHTML = rec.items.map((n) => card(n, true)).join("");
  $("pop").textContent = rec.popularity_weight == null ? "" : `· trọng số độ phổ biến ${(rec.popularity_weight * 100).toFixed(0)}%`;
  $("history").innerHTML = history.map((n) => card(n, false)).join("") || '<p class="muted">Chưa có lịch sử</p>';
}

$("recs").addEventListener("click", async (e) => {
  const id = e.target.dataset.id;
  if (!id) return;
  e.target.disabled = true;
  await fetch("/api/click", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: user(), news_id: id }) });
  refresh();
});

(async () => {
  const [info, users] = await Promise.all([get("/api/info"), get("/api/users")]);
  $("method").textContent = `${info.method} · ${info.num_news.toLocaleString()} tin`;
  $("user").insertAdjacentHTML("beforeend",
    users.map((u) => `<option value="${esc(u.user_id)}">${esc(u.user_id)} (${u.history_len} tin đã đọc)</option>`).join(""));
  $("user").selectedIndex = users.length ? 1 : 0;
  $("user").addEventListener("change", refresh);
  refresh();
})();
</script>
</body>
</html>
